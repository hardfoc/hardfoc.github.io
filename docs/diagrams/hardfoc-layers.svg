<text x="56" y="184.4" font-size="20" font-weight="700" fill="#115E59">hardfoc-vortex-v1</text>
<text x="56" y="215" font-size="17" fill="#2B3442">Vortex V1 motor controller firmware</text>
<text x="636" y="184.4" font-size="20" font-weight="700" fill="#115E59">hardfoc-flux-v1</text>
<text x="636" y="215" font-size="17" fill="#2B3442">Flux V1 valve controller firmware</text>
<text x="56" y="321.4" font-size="20" font-weight="700" fill="#17202C">hf-hal-vortex-v1</text>
<text x="56" y="352" font-size="17" fill="#2B3442">ESP32-C6, TMC9660, AS5047U</text>
<text x="636" y="321.4" font-size="20" font-weight="700" fill="#17202C">hf-hal-flux-v1</text>
<text x="636" y="352" font-size="17" fill="#2B3442">ESP32-S3, MAX22200, TLE92466ED</text>
<text x="56" y="458.4" font-size="20" font-weight="700" fill="#3730A3">hf-core</text>
<text x="56" y="489" font-size="17" fill="#2B3442">hf-core-drivers + hf-core-utils: device handlers, RTOS, CANopen</text>
<text x="56" y="595.4" font-size="20" font-weight="700" fill="#17202C">Chip drivers</text>
<text x="56" y="626" font-size="17" fill="#2B3442">hf-*-driver, no platform code</text>
<text x="442.7" y="595.4" font-size="20" font-weight="700" fill="#17202C">Interface wrap</text>
<text x="442.7" y="626" font-size="17" fill="#2B3442">hf-internal-interface-wrap, hf-pincfg</text>
<text x="829.3" y="595.4" font-size="20" font-weight="700" fill="#17202C">Utilities</text>
<text x="829.3" y="626" font-size="17" fill="#2B3442">hf-utils-general, hf-utils-rtos-wrap,</text>
<text x="829.3" y="650.7" font-size="17" fill="#2B3442">hf-utils-canopen</text>
