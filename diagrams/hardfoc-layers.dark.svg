<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Four layers, each a set of repositories</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Each layer is a Git submodule of the one above it, pinned to a commit or tag.</text>
